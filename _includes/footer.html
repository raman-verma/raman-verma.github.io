<footer class="footer">
    <ul class="social-links">
        <li>
            <a href="https://github.com/{{ site.data.social.github }}" target="_blank">
                <img src="data:image/svg+xml;base64,..." alt="GitHub" />
                github.com/{{ site.data.social.github }}
            </a>
        </li>
        <li>
            <a href="https://linkedin.com/in/{{ site.data.social.linkedin }}" target="_blank">
                <img src="data:image/svg+xml;base64,..." alt="LinkedIn" />
                linkedin.com/in/{{ site.data.social.linkedin }}
            </a>
        </li>
        <li>
            <a href="https://twitter.com/{{ site.data.social.twitter }}" target="_blank">
                <img src="data:image/svg+xml;base64,..." alt="Twitter" />
                @{{ site.data.social.twitter }}
            </a>
        </li>
    </ul>
    <div class="footer__credit">
        Designed with ♥ by Xiaoying Riley for developers
    </div>
</footer>
